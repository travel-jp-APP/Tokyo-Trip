        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }

            border-color: rgba(71, 71, 77, 0.5) !important;

        html.dark .text-stone-900, html.dark .text-stone-800, html.dark .text-stone-700 { color: #f4f4f5 !important; }

        html.dark .border-stone-100, html.dark .border-stone-200, html.dark .border-stone-200\/50,
        html.dark .border-stone-200\/60, html.dark .border-stone-300\/50 {

        }

        html.dark .bg-red-50 { background-color: rgba(127, 29, 29, 0.3) !important; color: #fca5a5 !important; }
        html.dark .bg-rose-50 { background-color: rgba(136, 19, 55, 0.3) !important; color: #fecdd3 !important; }
        html.dark .bg-sky-50 { background-color: rgba(12, 74, 110, 0.3) !important; color: #bae6fd !important; }
        html.dark .bg-emerald-50 { background-color: rgba(6, 78, 59, 0.3) !important; color: #a7f3d0 !important; }

<body>

                    <img src="Tokyo.jpg" alt="Tokyo Trip 主畫面圖示" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x200/e2e8f0/475569?text=Tokyo+Trip';"/>

            </div>

                <button id="tab-ios" onclick="switchGuideTab('ios')" class="flex-1 py-2 sm:py-2.5 rounded-xl flex items-center justify-center gap-1.5 sm:gap-2 transition-all bg-white text-indigo-950 font-bold shadow-sm">
                    <i data-lucide="apple" class="w-4 h-4 mb-0.5"></i>

                <button id="tab-android" onclick="switchGuideTab('android')" class="flex-1 py-2 sm:py-2.5 rounded-xl flex items-center justify-center gap-1.5 sm:gap-2 transition-all text-stone-500 hover:text-stone-800">
                    <i data-lucide="smartphone" class="w-4 h-4"></i>

            <div id="guide-ios" class="w-full bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-stone-200/60 space-y-3 sm:space-y-4 text-stone-700 text-xs sm:text-sm shrink-0">

                    <p class="leading-snug">在選單中選取「 <span class="font-bold text-stone-900">加入主畫面</span> 」 <i data-lucide="plus-square" class="inline w-3.5 h-3.5 sm:w-4 sm:h-4 text-indigo-600 ml-0.5 -mt-0.5"></i></p>
                </div>
                <div class="flex items-center gap-3">

            <div id="guide-android" class="hidden w-full bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-stone-200/60 space-y-3 sm:space-y-4 text-stone-700 text-xs sm:text-sm shrink-0">
                <div class="flex items-center gap-3">

                </div>
                <div class="flex items-center gap-3">
                    <span class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px] sm:text-xs font-bold shrink-0">2</span>

                <button id="android-install-btn" onclick="installPwa()" class="w-full mt-2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">

    <!-- 行程主程式容器 -->

    <script>
        // 動態確保網頁標題永遠為 Tokyo Trip 2026
        document.title = "Tokyo Trip 2026";

        /* ==========================================================================
           【開發 / 測試預覽模式與圖片開關設定】
           - DEV_PREVIEW_MODE = true  (ON)  : 開啟測試預覽模式 (關閉強制加入主畫面選單)
           - DEV_PREVIEW_MODE = false (OFF) : 正式模式 (必須加入手機「主畫面」才能開啟瀏覽)
           ========================================================================== */
        const DEV_PREVIEW_MODE = false; 

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('android-install-btn')?.classList.remove('hidden');
        });

        function installPwa() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
            } else {
                alert('請點擊 Chrome 右上角選單 (⋮)，然後選擇「加到主畫面」或「安裝應用程式」。');
            }
        }

        function initManifest() {
            const manifestData = {
                name: "Tokyo Trip 2026",
                short_name: "Tokyo Trip",
                start_url: "./?mode=standalone",
                display: "standalone",
                background_color: "#d6d3d1",
                theme_color: "#d6d3d1",
                icons: [{ src: "Tokyo.jpg", sizes: "512x512", type: "image/jpeg", purpose: "any maskable" }]
            };
            const linkTag = document.getElementById('pwa-manifest-link');
            if (linkTag) {
                linkTag.setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData)));
            }
        }

        const FOOTER_HTML = `
            <div class="w-full text-center pt-6 pb-2 shrink-0">
                <div class="inline-flex items-baseline gap-2">
                    <span class="text-stone-400 text-2xl sm:text-sm font-normal">Created by</span>
                    <span class="text-5xl sm:text-5xl text-stone-600" style="font-family: 'Dancing Script', cursive;">Wen</span>
                </div>
            </div>`;

        ['contextmenu', 'dragstart'].forEach(evt => {
            document.addEventListener(evt, e => {
                if (['IMG', 'VIDEO'].includes(e.target.tagName)) e.preventDefault();
            }, false);
        });

        const TRIP_DATA = {
            Itinerary: [
                { id: "day1", date: "10/25", dayOfWeek: "日", location: "上野 ➔ 淺草 ➔ 晴空塔", weather: "sunny", temp: "20°C", items: [
                    { type: "visit", time: "15:00", title: "東京観光情報センター 京成上野", mapUrl: "https://maps.app.goo.gl/xdT7DSB2m4nwEEUg6", cardUrl: "https://www.gk-p.jp/wp-content/uploads/mhc/13-100-C-01.jpg", note: "【營業時間】08:30–18:30\n【景點介紹】位於京成上野站內的旅客服務中心，提供東京與周邊觀光諮詢、景點地圖發放與特製人孔蓋卡索取。" },
                    { type: "shrine", time: "15:45", title: "淺草觀音寺", mapUrl: "https://maps.app.goo.gl/8BQVM5rRSpQwnJHp7", stampUrl: "https://www.senso-ji.jp/charm/", note: "【營業時間】06:00–17:00 (本堂)\n【景點介紹】東京最古老寺廟，拍照打卡大紅燈籠雷門與仲見世通，祈求平安與開運。" },
                    { type: "visit", time: "16:45", title: "淺草文化觀光中心展望台", mapUrl: "https://maps.app.goo.gl/c7CVXd33e1KEovJZ8", note: "【營業時間】09:00–20:00\n【景點介紹】位於 8 樓的免費展望台，能俯瞰淺草寺全景與遠眺東京晴空塔，視野極佳。" },
                    { type: "visit", time: "17:30", title: "吾妻橋", mapUrl: "https://maps.app.goo.gl/TJpmH8f4wezZE4iz8", note: "【營業時間】24 小時開放\n【景點介紹】橫跨隅田川的大紅朱色橋樑，是拍攝朝日啤酒金色雲朵與晴空塔合影的經典地點。" },
                    { type: "visit", time: "18:00", title: "墨田服務站 (コネクトすみだまち処)", mapUrl: "https://maps.app.goo.gl/UV2FLDXpUmaiDb9B6", cardUrl: "https://www.city.sumida.lg.jp/bunka_kanko/annnai/kankou/designmanhole-sumida.html", note: "【營業時間】10:30–19:00\n【景點介紹】墨田區觀光案內與產業推廣基地，販售在地精緻工藝品與伴手禮，並發放墨田區特色設計人孔蓋卡。" },
                    { type: "visit", time: "18:45", title: "十間橋", mapUrl: "https://maps.app.goo.gl/vKDWM7M9tfc8ucMA7", note: "【營業時間】24 小時開放\n【景點介紹】攝影愛好者的私房景點，河面上完美倒映晴空塔夜景（逆晴空塔）。" },
                    { type: "visit", time: "19:15", title: "東京晴空塔 (Tokyo Skytree)", mapUrl: "https://maps.app.goo.gl/3z5jrjHyA66HRgfQ6", note: "【營業時間】10:00–21:00 (展望台)\n【景點介紹】世界第一高自立式電波塔，登上高空展望台欣賞東京無敵夜景，下樓可採買索拉町商圈美食與周邊。" }
                ]},
                { id: "day2", date: "10/26", dayOfWeek: "一", location: "豐洲 ➔ 台場 ➔ 神社巡禮 ➔ 東京鐵塔", weather: "sunny", temp: "19°C", items: [
                    { type: "shop", time: "06:30", title: "豐洲市場 壽司大", mapUrl: "https://maps.app.goo.gl/HNm26xizuXfGVoVY6", note: "【營業時間】06:00–14:00 (週日、例假日、市場休館日公休)\n【景點介紹】東京超人氣頂級握壽司名店，選用新鮮極品海鮮，建議提早前往排隊抽號碼牌。" },

            { title: "橘黃色實線", desc: "🚫 禁止變換車道", lineStyle: `<div class="w-full h-12 bg-stone-600 rounded flex items-center justify-center px-2"><div class="w-full h-1 bg-amber-500"></div></div>` },
            { title: "雙橘實線", desc: "⚠️ 嚴禁跨越/迴轉", lineStyle: `<div class="w-full h-12 bg-stone-600 rounded flex flex-col items-center justify-center gap-1 px-2"><div class="w-full h-0.5 bg-amber-500"></div><div class="w-full h-0.5 bg-amber-500"></div></div>` },
            { title: "停車格：輕", desc: "🟡 輕自動車專用", lineStyle: `<div class="w-full h-12 bg-stone-600 rounded flex items-center justify-center"><div class="border-2 border-amber-400 text-amber-400 font-bold text-xs px-2 py-0.5 rounded">輕</div></div>` }
        ];

        /* 各導航分頁顏色與圖示 */
        const NAV_TABS = [
            { id: 'Itinerary', label: '行程', icon: 'calendar', color: 'text-amber-600' },
            { id: 'flights', label: '航班/住宿', icon: 'plane', color: 'text-sky-600' },
            { id: 'manhole', label: '自駕須知', icon: 'car', color: 'text-emerald-600' },
            { id: 'food', label: '美食', icon: 'utensils', color: 'text-rose-600' },
            { id: 'map', label: '地圖', icon: 'map', color: 'text-indigo-600' },
            { id: 'notes', label: '備註', icon: 'notebook-pen', color: 'text-purple-600' }
        ];

        const state = {
            activeTab: 'Itinerary',
            selectedDayId: 'day1'
        };

        function getDeletedItems() {
            try { return JSON.parse(localStorage.getItem('deleted_itinerary_items')) || []; }
            catch { return []; }
        }

        function toggleDeleteItem(itemId) {
            const deleted = getDeletedItems();
            const index = deleted.indexOf(itemId);
            if (index > -1) deleted.splice(index, 1);
            else deleted.push(itemId);
            localStorage.setItem('deleted_itinerary_items', JSON.stringify(deleted));
            updateView();
        }

        function setTheme(isDark) {
            document.documentElement.classList.toggle('dark', isDark);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#121212' : '#d6d3d1');
            updateThemeIcon();
        }

        function toggleDarkMode() {
            const isDark = !document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            setTheme(isDark);
        }

        function updateThemeIcon() {
            const btn = document.getElementById('dark-mode-toggle');
            if (btn) {
                const isDark = document.documentElement.classList.contains('dark');
                btn.innerHTML = isDark 
                    ? `<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>` 
                    : `<i data-lucide="moon" class="w-4 h-4 text-stone-600"></i>`;
                lucide.createIcons();
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(isDark);
        }

        const getGoogleMapUrl = name => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
        const getIcon = (name, classes = "", size = 24) => `<i data-lucide="${name}" class="${classes}" width="${size}" height="${size}"></i>`;

        const renderWeatherIcon = type => {
            const icon = WEATHER_ICONS[type] || WEATHER_ICONS.sunny;
            return getIcon(icon.name, `w-5 h-5 ${icon.class}`);
        };

        function checkPwaStatus() {
            const urlParams = new URLSearchParams(window.location.search);
            const isStandalone = ['standalone', 'fullscreen', 'minimal-ui', 'window-controls-overlay'].some(m => window.matchMedia(`(display-mode: ${m})`).matches) ||
                                 window.navigator.standalone || document.referrer.includes('android-app://') ||
                                 urlParams.get('mode') === 'standalone' || urlParams.has('pwa');

            const showApp = DEV_PREVIEW_MODE || isStandalone;
            document.getElementById('pwa-prompt-screen')?.classList.toggle('hidden', showApp);
            document.getElementById('main-app-container')?.classList.toggle('hidden', !showApp);

            if (showApp) updateView();
            lucide.createIcons();
        }

        function switchGuideTab(os) {
            const isIos = os === 'ios';
            const baseClass = "flex-1 py-2 sm:py-2.5 rounded-xl flex items-center justify-center gap-1.5 sm:gap-2 transition-all ";
            const activeClass = baseClass + "bg-white text-indigo-950 font-bold shadow-sm";
            const inactiveClass = baseClass + "text-stone-500 hover:text-stone-800";

            document.getElementById('tab-ios').className = isIos ? activeClass : inactiveClass;
            document.getElementById('tab-android').className = isIos ? inactiveClass : activeClass;
            document.getElementById('guide-ios').classList.toggle('hidden', !isIos);
            document.getElementById('guide-android').classList.toggle('hidden', isIos);
            lucide.createIcons();
        }

        function renderItineraryItem(item, itemId, isDeleted) {
            if (item.type === 'ticket') {
                const s = ITEM_STYLES.ticket;
                return `
                <div class="flex items-center gap-4 p-4 bg-white/95 backdrop-blur-sm rounded-lg border-l-4 shadow-sm mb-3 ${s.border} active:bg-stone-50 transition-all ${isDeleted ? 'opacity-50 grayscale bg-stone-100/70' : ''}">
                    <div class="flex items-center justify-center min-w-[50px]">
                        <div class="p-1.5 rounded-full bg-stone-50 ${s.color}">${getIcon(s.icon, "", 18)}</div>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-stone-800 text-lg leading-tight select-text ${isDeleted ? 'line-through decoration-red-500 decoration-2 text-stone-400' : ''}">${item.title}</h3>
                    </div>
                    <button onclick="toggleDeleteItem('${itemId}')" class="p-2 ${isDeleted ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-red-50 text-red-500 hover:bg-red-100'} rounded-full active:scale-95 shrink-0 transition-colors" title="${isDeleted ? '復原行程' : '刪除行程'}">
                        ${getIcon(isDeleted ? 'rotate-ccw' : 'trash-2', "", 18)}
                    </button>
                </div>`;
            }

            let iconName = 'map-pin', iconColor = "text-stone-400", borderColor = "border-stone-200", isEmoji = false;
            const s = ITEM_STYLES[item.type];

            if (s) {
                if (s.emoji) isEmoji = true; else iconName = s.icon;
                iconColor = s.color; borderColor = s.border;
            } else if (item.type === 'transport') {
                const t = item.title;
                if (t.includes("JX846") || t.includes("JX847") || t.includes("MM626") || t.includes("GK011")) {
                    iconName = 'plane'; iconColor = "text-amber-600"; borderColor = "border-l-amber-600";
                } else if (item.mode === 'car' || t.includes("租車") || t.includes("前往")) {
                    iconName = 'car'; iconColor = "text-lime-600"; borderColor = "border-l-lime-600";
                } else if (t.includes("公車") || t.includes("巴士")) {
                    iconName = 'bus'; iconColor = "text-teal-600"; borderColor = "border-l-teal-600";
                } else {
                    iconName = 'train-front'; iconColor = "text-indigo-400"; borderColor = "border-l-indigo-400";
                }
            }

            const isCollection = item.tag === "收集";
            if (isCollection) { 
                iconName = 'star'; iconColor = "text-amber-500"; borderColor = "border-l-amber-500"; 
            }

            const destinationUrl = item.mapUrl || getGoogleMapUrl(item.title);

            return `
            <div class="flex gap-4 p-4 bg-white/95 backdrop-blur-sm rounded-lg border-l-4 shadow-sm mb-3 ${borderColor} active:bg-stone-50 transition-all ${isDeleted ? 'opacity-50 grayscale bg-stone-100/70' : ''}">
                <div class="flex flex-col items-center min-w-[50px]">
                    ${item.time ? `<span class="text-sm font-bold text-stone-600 font-mono ${isDeleted ? 'line-through text-stone-400' : ''}">${item.time}</span>` : ''}
                    <div class="mt-2 p-1.5 rounded-full bg-stone-50 ${iconColor}">
                        ${isEmoji ? '<span class="text-lg leading-none">⛩️</span>' : getIcon(iconName, "", 18)}
                    </div>
                    ${isCollection ? '<span class="text-[9px] text-amber-600 font-bold mt-1">GET!</span>' : ''}
                </div>
                <div class="flex-1">
                    <div class="flex items-start justify-between">
                        <h3 class="font-bold text-stone-800 text-lg leading-tight w-[calc(100%-110px)] sm:w-[calc(100%-150px)] select-text ${isDeleted ? 'line-through decoration-red-500 decoration-2 text-stone-400' : ''}">${item.title}</h3>
                        <div class="flex gap-1.5 shrink-0 items-center"> 
                            ${item.bookingUrl ? `<a href="${item.bookingUrl}" target="_blank" class="p-2 bg-red-50 text-red-600 rounded-full active:scale-95 shrink-0" title="資訊網站">${getIcon('circle-alert', "", 18)}</a>` : ''}
                            ${item.stampUrl ? `<a href="${item.stampUrl}" target="_blank" class="p-2 bg-rose-50 text-rose-600 rounded-full active:scale-95 shrink-0" title="御朱印/紀念章">${getIcon('stamp', "", 18)}</a>` : ''}
                            ${item.cardUrl ? `<a href="${item.cardUrl}" target="_blank" class="p-2 bg-indigo-50 text-indigo-600 rounded-full active:scale-95 shrink-0" title="井蓋卡資訊">${getIcon('credit-card', "", 18)}</a>` : ''}
                            ${item.weatherUrl ? `<a href="${item.weatherUrl}" target="_blank" class="p-2 bg-sky-50 text-sky-600 rounded-full active:scale-95 shrink-0" title="天氣資訊">${getIcon('cloud-sun', "", 18)}</a>` : ''}
                            ${item.routeUrl ? `<a href="${item.routeUrl}" target="_blank" class="p-2 bg-emerald-50 text-emerald-600 rounded-full active:scale-95 shrink-0" title="路線導航">${getIcon('route', "", 18)}</a>` : ''}
                            <a href="${destinationUrl}" target="_blank" class="p-2 bg-blue-50 text-blue-600 rounded-full active:scale-95 shrink-0" title="地圖導航">${getIcon('navigation', "", 18)}</a>
                            <button onclick="toggleDeleteItem('${itemId}')" class="p-2 ${isDeleted ? 'bg-amber-100 text-amber-700 hover:bg-amber-200' : 'bg-red-50 text-red-500 hover:bg-red-100'} rounded-full active:scale-95 shrink-0 transition-colors" title="${isDeleted ? '復原行程' : '刪除行程'}">
                                ${getIcon(isDeleted ? 'rotate-ccw' : 'trash-2', "", 18)}
                            </button>
                        </div>
                    </div>
                    ${item.tag ? `<div class="mt-1"><span class="text-[10px] px-2 py-0.5 rounded-full border font-medium mr-2 ${isCollection ? "border-amber-400 text-amber-600 bg-amber-50" : "border-stone-300 text-stone-500"} ${isDeleted ? 'line-through opacity-70' : ''}">${item.tag}</span></div>` : ''}
                    ${item.highlight ? `<div class="mt-2 inline-block px-3 py-1 bg-red-50 text-red-600 text-xs rounded-md font-bold select-text ${isDeleted ? 'line-through opacity-70' : ''}">★ ${item.highlight}</div>` : ''}
                    ${item.note ? `<div class="mt-2 text-sm text-stone-600 leading-relaxed bg-stone-50 p-3 rounded border border-stone-100 whitespace-pre-line select-text ${isDeleted ? 'line-through opacity-60' : ''}">${item.note}</div>` : ''}
                </div>
            </div>`;
        }

        function renderItineraryView(dayId) {
            const currentDayData = TRIP_DATA.Itinerary.find(d => d.id === dayId);
            if (!currentDayData) return '';

            const headerStatus = document.getElementById('header-status');
            headerStatus.innerHTML = `${renderWeatherIcon(currentDayData.weather)}<span class="text-sm font-bold text-stone-600">${currentDayData.temp}</span>`;
            headerStatus.classList.remove('hidden');

            const hasItems = currentDayData.items && currentDayData.items.length > 0;
            const deletedSet = new Set(getDeletedItems());

            return `
                <div class="animate-fade-in-up pb-6">
                    <div class="flex items-center justify-between mb-4 px-1">
                        <h2 class="text-xl font-bold text-stone-800">Day ${dayId.replace('day', '')} <span class="ml-2 text-xl font-bold text-stone-800">${currentDayData.location}</span></h2>
                    </div>
                    ${hasItems 
                        ? currentDayData.items.map((item, index) => renderItineraryItem(item, `${dayId}_${index}`, deletedSet.has(`${dayId}_${index}`))).join('')
                        : '<div class="text-center py-10 text-stone-500 bg-white/50 rounded-xl border border-stone-200">此日期暫無行程資料</div>'
                    }
                    ${FOOTER_HTML}
                </div>`;
        }

        function renderDateScroller() {
            const scroller = document.getElementById('date-scroller');
            if (!scroller) return;

            scroller.innerHTML = TRIP_DATA.Itinerary.map(day => {
                const isActive = day.id === state.selectedDayId;
                return `
                    <button id="date-btn-${day.id}" onclick="selectDay('${day.id}')" class="snap-center flex-1 min-w-[46px] shrink-0 flex flex-col items-center justify-center h-14 sm:h-16 rounded-xl sm:rounded-2xl transition-all duration-200 ${
                        isActive 
                            ? 'bg-indigo-900 text-white font-bold shadow-md scale-105 border-2 border-indigo-900 z-10' 
                            : 'bg-white/80 text-stone-600 border border-stone-200/80 hover:bg-stone-100'
                    }">
                        <span class="text-[10px] sm:text-[11px] uppercase font-bold opacity-80 whitespace-nowrap">${day.date}</span>
                        <span class="text-sm sm:text-base font-black leading-tight">${day.dayOfWeek}</span>
                    </button>
                `;
            }).join('');

            setTimeout(() => {
                document.getElementById(`date-btn-${state.selectedDayId}`)?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }, 50);
        }

        function selectDay(dayId) {
            state.selectedDayId = dayId;
            renderDateScroller();
            updateView();
        }

        function renderFlightsView() {
            const flightsHtml = TRIP_DATA.flights.map(flight => `
                <div class="bg-white/95 backdrop-blur-sm rounded-xl shadow-sm border border-stone-200 overflow-hidden p-5 mb-4">
                    <div class="flex items-center justify-between mb-4 border-b border-stone-100 pb-3">
                        <span class="text-xs font-bold px-2 py-1 rounded ${flight.type === 'Departure' ? 'bg-indigo-100 text-indigo-700' : 'bg-orange-100 text-orange-700'}">${flight.type === 'Departure' ? '去程' : '回程'}</span>
                        <span class="font-mono font-bold text-stone-500">${flight.date}</span>
                    </div>
                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center gap-3">
                            <div class="text-3xl font-black text-stone-800">${flight.code}</div>
                            ${flight.flightUrl ? `<a href="${flight.flightUrl}" target="_blank" class="p-1.5 bg-sky-50 text-sky-600 rounded-full active:scale-95 transition-transform">${getIcon('circle-alert', "", 18)}</a>` : ''}
                        </div>
                        <div class="text-stone-300 rotate-45">${getIcon('plane', "", 24)}</div>
                    </div>
                    <div class="text-sm font-medium text-stone-600 mb-4">${flight.airline} • ${flight.class}</div>
                    <div class="bg-stone-50 p-4 rounded-lg text-center border border-stone-100">
                        <div class="text-lg font-bold text-stone-800 mb-1">${flight.route}</div>
                        <div class="text-xs text-stone-500">${flight.terminal} • ${flight.duration} • ${flight.aircraft}</div>
                    </div>
                </div>`).join('');

            const hotelsHtml = TRIP_DATA.hotels.map(hotel => `
                <div class="bg-white/95 backdrop-blur-sm rounded-xl shadow-sm border border-stone-200 overflow-hidden p-0 mb-4">
                    <div class="h-60 bg-stone-200 relative overflow-hidden">
                        ${hotel.image ? `<img src="${hotel.image}" alt="${hotel.name}" class="w-full h-full object-cover">` : `<div class="w-full h-full bg-gradient-to-r from-stone-200 to-stone-300 flex items-center justify-center">${getIcon('bed-double', "text-white w-10 h-10 opacity-50")}</div>`}
                    </div>
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-1">
                            <div>
                                <h3 class="text-lg font-bold text-stone-800 leading-tight">${hotel.name}</h3>
                                ${hotel.stars ? `
                                    <div class="flex items-center gap-1 text-amber-500 text-xs font-bold mt-1">
                                        <div class="flex items-center gap-0.5">
                                            ${Array(hotel.stars).fill(getIcon('star', "fill-amber-400 text-amber-400", 14)).join('')}
                                        </div>
                                        <span class="text-stone-500 font-medium ml-1">${hotel.stars} 星級飯店</span>
                                    </div>
                                ` : ''}
                            </div>
                            <span class="text-xs bg-stone-100 text-stone-600 px-2 py-1 rounded font-medium whitespace-nowrap shrink-0 ml-2">${hotel.dates}</span>
                        </div>
                        <p class="text-xs text-stone-400 mb-4 font-mono">${hotel.engName}</p>
                        <div class="flex items-start gap-2 mb-4 text-sm text-stone-600">${getIcon('map-pin', "mt-0.5 text-stone-400 shrink-0", 16)}<span>${hotel.location}</span></div>
                        <div class="flex flex-wrap gap-2 mb-4">${hotel.features.map(f => `<span class="text-[10px] px-2 py-1 bg-indigo-50 text-indigo-600 rounded">${f}</span>`).join('')}</div>
                        <div class="bg-amber-50 p-3 rounded text-sm text-amber-800 border border-amber-100 flex gap-2 leading-relaxed">${getIcon('info', "shrink-0 mt-0.5", 16)}<span>${hotel.note}</span></div>
                        <a href="${hotel.mapUrl || getGoogleMapUrl(hotel.name)}" target="_blank" class="mt-4 block w-full py-3 bg-stone-800 text-white text-center rounded-lg text-sm font-bold active:bg-stone-900 transition active:scale-[0.98]">導航至飯店</a>
                    </div>
                </div>`).join('');

            return `<div class="space-y-4 animate-fade-in pb-6"><h2 class="text-xl font-bold text-stone-800 px-1">航班資訊</h2>${flightsHtml}<h2 class="text-xl font-bold text-stone-800 px-1 mt-8 pt-4 border-t border-stone-300/50">住宿資訊</h2>${hotelsHtml}${FOOTER_HTML}</div>`;
        }

        function renderDriveView() {
            const noticesHtml = DRIVE_NOTICES.map(item => `
                <div class="bg-white/95 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-stone-200 border-l-4 border-l-lime-500 flex gap-3">
                    <div class="mt-0.5 text-amber-500 shrink-0">${getIcon('triangle-alert', "", 20)}</div>
                    <div>
                        <h3 class="font-bold text-stone-800 text-base mb-1">${item.title}</h3>
                        <p class="text-sm text-stone-600 leading-relaxed">${item.text}</p>
                    </div>
                </div>`).join('');

            const signsHtml = TRAFFIC_SIGNS.map(sign => `
                <div class="bg-white/95 backdrop-blur-sm p-3 rounded-xl shadow-sm border border-stone-200 text-center flex flex-col justify-between h-full">
                    <div class="my-auto py-2">${sign.svg}</div>
                    <div>
                        <div class="font-bold text-stone-800 text-xs sm:text-sm mt-1">${sign.title}</div>
                        <div class="text-[10px] text-stone-500 font-medium">${sign.desc}</div>
                    </div>
                </div>`).join('');

            const markingsHtml = ROAD_MARKINGS.map(m => `
                <div class="bg-white/95 backdrop-blur-sm p-3 rounded-xl shadow-sm border border-stone-200 text-center flex flex-col justify-between">

                    <div>
                        <div class="font-bold text-stone-800 text-xs sm:text-sm mt-1">${m.title}</div>
                        <div class="text-[10px] text-stone-500 font-medium">${m.desc}</div>

            return `
                <div class="animate-fade-in space-y-6 pb-6">
                    <div>
                        <h2 class="text-xl font-bold text-stone-800 px-1 mb-3 flex items-center gap-2">
                            ${getIcon('car', "text-emerald-600", 24)} 日本自駕注意事項
                        </h2>
                        <div class="mb-4 rounded-xl overflow-hidden shadow-sm border border-stone-200">
                            <img src="car.jpg" alt="日本自駕注意事項" class="w-full h-auto object-cover" onerror="this.parentElement.style.display='none';"/>
                        </div>
                        <div class="space-y-3">${noticesHtml}</div>
                    </div>

                    <div>
                        <h2 class="text-xl font-bold text-stone-800 px-1 mb-3 flex items-center gap-2">
                            ${getIcon('shield-alert', "text-rose-600", 24)} 常見交通標誌
                        </h2>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${signsHtml}</div>

                    <div>
                        <h2 class="text-xl font-bold text-stone-800 px-1 mb-3 flex items-center gap-2">
                            ${getIcon('git-commit', "text-amber-600", 24)} 標線說明

                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${markingsHtml}</div>
                    </div>

        function renderFoodView() {
            const foodHtml = TRIP_DATA.food.map(cat => `
                <div class="bg-white/95 backdrop-blur-sm rounded-xl shadow-sm border border-stone-200 p-5 mb-4">
                    <h3 class="text-lg font-bold text-stone-800 mb-3 flex items-center gap-2 border-b border-stone-100 pb-2">
                        ${getIcon(cat.icon || 'utensils', "text-rose-500", 20)}
                        <span>${cat.category}</span>
                    </h3>
                    <div class="space-y-2.5">
                        ${cat.items.map(item => `
                            <div class="flex justify-between items-center bg-stone-50 p-3 rounded-lg border border-stone-100/80 hover:bg-stone-100/80 transition">
                                <span class="font-bold text-stone-700 text-sm select-text">${item.name}</span>
                                <a href="${item.url}" target="_blank" class="p-2 bg-blue-50 text-blue-600 rounded-full active:scale-95 shrink-0 transition" title="地圖">

                        `).join('')}

            `).join('');

            return `
                <div class="animate-fade-in space-y-4 pb-6">
                    <h2 class="text-xl font-bold text-stone-800 px-1 flex items-center gap-2">

                    </h2>
                    ${foodHtml}
                    ${FOOTER_HTML}
                </div>`;
        }

        function renderMapView() {
            const mapHtml = TRIP_DATA.mapLinks.map(cat => `
                <div class="bg-white/95 backdrop-blur-sm rounded-xl shadow-sm border border-stone-200 p-5 mb-4">
                    <h3 class="text-lg font-bold text-stone-800 mb-3 flex items-center gap-2 border-b border-stone-100 pb-2">
                        ${getIcon(cat.icon || 'map-pin', "text-indigo-600", 20)}
                        <span>${cat.category}</span>
                    </h3>
                    <div class="space-y-2.5">
                        ${cat.links.map(link => `
                            <div class="flex justify-between items-center bg-stone-50 p-3 rounded-lg border border-stone-100/80 hover:bg-stone-100/80 transition">
                                <span class="font-bold text-stone-700 text-sm select-text">${link.title}</span>
                                <a href="${link.url}" target="_blank" class="p-2 bg-indigo-50 text-indigo-600 rounded-full active:scale-95 shrink-0 transition" title="開啟連結">
                                    ${getIcon('external-link', "", 16)}
                                </a>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            return `
                <div class="animate-fade-in space-y-4 pb-6">
                    <h2 class="text-xl font-bold text-stone-800 px-1 flex items-center gap-2">
                        ${getIcon('map', "text-indigo-600", 24)} 地圖與實用連結
                    </h2>
                    ${mapHtml}
                    ${FOOTER_HTML}
                </div>`;
        }

        function renderNotesView() {
            const notesHtml = TRIP_DATA.notes.map(note => `
                <div class="bg-white/95 backdrop-blur-sm rounded-xl shadow-sm border border-stone-200 overflow-hidden mb-4">
                    <div class="p-4 bg-stone-50 border-b border-stone-100">
                        <h3 class="font-bold text-stone-800 text-base flex items-center gap-2">
                            ${getIcon('notebook-pen', "text-purple-600", 18)}
                            <span>${note.title}</span>
                        </h3>
                    </div>
                    ${note.image ? `
                        <div class="p-2">
                            <img src="${note.image}" alt="${note.title}" class="w-full h-auto rounded-lg object-contain" onerror="this.onerror=null; this.src='https://placehold.co/600x400/e2e8f0/475569?text=${encodeURIComponent(note.title)}';"/>
                        </div>
                    ` : ''}
                </div>
            `).join('');

            return `
                <div class="animate-fade-in space-y-4 pb-6">
                    <h2 class="text-xl font-bold text-stone-800 px-1 flex items-center gap-2">
                        ${getIcon('notebook-pen', "text-purple-600", 24)} 備註與圖卡
                    </h2>
                    ${notesHtml}
                    ${FOOTER_HTML}
                </div>`;
        }

        function updateView() {
            const mainContent = document.getElementById('main-content');
            const dateScrollerContainer = document.getElementById('date-scroller-container');
            const headerStatus = document.getElementById('header-status');

            if (state.activeTab === 'Itinerary') {
                dateScrollerContainer.classList.remove('hidden');
                renderDateScroller();
                mainContent.innerHTML = renderItineraryView(state.selectedDayId);
            } else {
                dateScrollerContainer.classList.add('hidden');
                headerStatus.classList.add('hidden');
                
                if (state.activeTab === 'flights') {
                    mainContent.innerHTML = renderFlightsView();
                } else if (state.activeTab === 'manhole') {
                    mainContent.innerHTML = renderDriveView();
                } else if (state.activeTab === 'food') {
                    mainContent.innerHTML = renderFoodView();
                } else if (state.activeTab === 'map') {
                    mainContent.innerHTML = renderMapView();
                } else if (state.activeTab === 'notes') {
                    mainContent.innerHTML = renderNotesView();
                }
            }

            renderBottomNav();
            lucide.createIcons();
            mainContent.scrollTop = 0;
        }

        function renderBottomNav() {
            const nav = document.getElementById('bottom-nav');
            if (!nav) return;

            nav.innerHTML = NAV_TABS.map(tab => {
                const isActive = tab.id === state.activeTab;
                return `
                    <button onclick="switchTab('${tab.id}')" class="flex flex-col items-center justify-center flex-1 py-1 px-2.5 transition-colors ${
                        isActive ? `${tab.color} font-bold scale-105` : 'text-stone-400 hover:text-stone-600'
                    }">
                        ${getIcon(tab.icon, "w-5 h-5 mb-0.5")}
                        <span class="text-[11px] font-medium leading-none">${tab.label}</span>
                    </button>
                `;
            }).join('');
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            updateView();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initManifest();
            initTheme();
            checkPwaStatus();
        });
    </script>
</body>
</html>
