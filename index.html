function renderBottomNav() {
const nav = document.getElementById('bottom-nav');
if (!nav) return;
nav.innerHTML = NAV_TABS.map(tab => {
const isActive = tab.id === state.activeTab;
const colorClass = isActive ? (tab.color || 'text-indigo-900') : 'text-stone-400 hover:text-stone-600';
return ⁠<button onclick="switchTab('${tab.id}')" class="flex flex-col items-center justify-center py-1 px-3 min-w-[64px] transition-all ${colorClass}"> <div class="p-1 rounded-xl ${isActive ? 'bg-stone-100/80' : ''}"> ${getIcon(tab.icon, "w-5 h-5")} </div> <span class="text-[11px] mt-0.5 font-bold whitespace-nowrap">${tab.label}</span> </button>⁠;
}).join('');
lucide.createIcons();
}
function switchTab(tabId) {
state.activeTab = tabId;
renderBottomNav();
updateView();
}
function updateView() {
const mainContent = document.getElementById('main-content');
const dateScrollerContainer = document.getElementById('date-scroller-container');
const headerStatus = document.getElementById('header-status');
if (!mainContent) return;
const isItinerary = state.activeTab === 'Itinerary';
if (dateScrollerContainer) dateScrollerContainer.classList.toggle('hidden', !isItinerary);
if (!isItinerary && headerStatus) headerStatus.classList.add('hidden');
const views = {
Itinerary: () => renderItineraryView(state.selectedDayId),
flights: renderFlightsView,
manhole: renderDriveView,
map: renderMapView,
notes: renderNotesView
};
mainContent.innerHTML = (views[state.activeTab] || views.Itinerary)();
mainContent.scrollTop = 0;
lucide.createIcons();
}

const swUrl = URL.createObjectURL(blob);

}

});
</script>
