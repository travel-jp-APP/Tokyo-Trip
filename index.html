        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;

            background-color: #d6d3d1; 
            color: #1c1917; 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 防止手機與電腦瀏覽時儲存/長按選取圖片 */
        img, video {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            pointer-events: none !important;
        }

        #main-content { -webkit-overflow-scrolling: touch; touch-action: pan-y; }
        #date-scroller, #bottom-nav { -webkit-overflow-scrolling: touch; touch-action: pan-x; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up, .animate-fade-in { 
            animation: fadeInUp 0.4s ease-out forwards; 
        }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('android-install-btn');
            if (installBtn) {
                installBtn.classList.remove('hidden');
            }
        });

        function installPwa() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                });
            }
        }

                        src: "Tokyo.jpg",
                        sizes: "512x512",
                        type: "image/jpeg"
                    }
                ]
            };
            const stringified = JSON.stringify(manifestData);
            const blob = new Blob([stringified], { type: 'application/manifest+json' });
            const manifestUrl = URL.createObjectURL(blob);
            const linkTag = document.getElementById('pwa-manifest-link');
            if (linkTag) {

        function getDeletedItems() {
            try { return JSON.parse(localStorage.getItem('deleted_itinerary_items') || '[]'); }
            catch (e) { return []; }
        }

        function toggleDeleteItem(itemId) {
            const deleted = getDeletedItems();
            const index = deleted.indexOf(itemId);
            if (index > -1) deleted.splice(index, 1);
            else deleted.push(itemId);
            localStorage.setItem('deleted_itinerary_items', JSON.stringify(deleted));
            updateView();
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#121212' : '#d6d3d1');
        }

        function updateThemeIcon() {
            const btn = document.getElementById('dark-mode-toggle');
            if (btn) {
                const isDark = document.documentElement.classList.contains('dark');
                btn.innerHTML = isDark 
                    ? `<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>` 
                    : `<i data-lucide="moon" class="w-4 h-4 text-stone-600"></i>`;
                lucide.createIcons();
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDark);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#121212' : '#d6d3d1');
            updateThemeIcon();
        }

        const getGoogleMapUrl = name => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
        const getIcon = (name, classes = "", size = 24) => `<i data-lucide="${name}" class="${classes}" width="${size}" height="${size}"></i>`;

        const renderWeatherIcon = type => {
            const icon = WEATHER_ICONS[type] || WEATHER_ICONS.sunny;
            return getIcon(icon.name, `w-5 h-5 ${icon.class}`);
        };

        function checkPwaStatus() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                                 (window.navigator.standalone === true);
            const promptScreen = document.getElementById('pwa-prompt-screen');
            const appContainer = document.getElementById('main-app-container');

            if (DEV_PREVIEW_MODE) {
                if (promptScreen) promptScreen.classList.add('hidden');
                if (appContainer) appContainer.classList.remove('hidden');
                return true;
            }

            if (isStandalone) {
                if (promptScreen) promptScreen.classList.add('hidden');
                if (appContainer) appContainer.classList.remove('hidden');
                return true;
            } else {
                if (promptScreen) promptScreen.classList.remove('hidden');
                if (appContainer) appContainer.classList.add('hidden');
                return false;
            }
        }

        function switchGuideTab(type) {
            const tabIos = document.getElementById('tab-ios');
            const tabAndroid = document.getElementById('tab-android');
            const guideIos = document.getElementById('guide-ios');
            const guideAndroid = document.getElementById('guide-android');

            if (type === 'ios') {
                tabIos.className = "flex-1 py-2 sm:py-2.5 rounded-xl flex items-center justify-center gap-1.5 sm:gap-2 transition-all bg-white text-indigo-950 font-bold shadow-sm";
                tabAndroid.className = "flex-1 py-2 sm:py-2.5 rounded-xl flex items-center justify-center gap-1.5 sm:gap-2 transition-all text-stone-500 hover:text-stone-800";
                guideIos.classList.remove('hidden');
                guideAndroid.classList.add('hidden');
            } else {
                tabAndroid.className = "flex-1 py-2 sm:py-2.5 rounded-xl flex items-center justify-center gap-1.5 sm:gap-2 transition-all bg-white text-indigo-950 font-bold shadow-sm";
                tabIos.className = "flex-1 py-2 sm:py-2.5 rounded-xl flex items-center justify-center gap-1.5 sm:gap-2 transition-all text-stone-500 hover:text-stone-800";
                guideAndroid.classList.remove('hidden');
                guideIos.classList.add('hidden');

        function renderHeaderStatus(day) {
            const statusEl = document.getElementById('header-status');
            if (state.activeTab === 'Itinerary' && day) {
                statusEl.innerHTML = `

                        ${renderWeatherIcon(day.weather)}
                        <span>${day.temp}</span>
                    </div>
                `;
                statusEl.classList.remove('hidden');
            } else {
                statusEl.classList.add('hidden');
            }

        function renderDateScroller() {
            const container = document.getElementById('date-scroller-container');
            const scroller = document.getElementById('date-scroller');

            if (state.activeTab !== 'Itinerary') {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            scroller.innerHTML = TRIP_DATA.Itinerary.map(day => {
                const isSelected = day.id === state.selectedDayId;
                const activeClass = isSelected 
                    ? 'bg-indigo-900 text-white shadow-md scale-105' 
                    : 'bg-white/90 text-stone-600 hover:bg-stone-50';

                return `
                    <button onclick="selectDay('${day.id}')" 
                            class="flex-shrink-0 flex flex-col items-center justify-center w-14 h-16 rounded-2xl transition-all duration-200 border border-stone-200/50 ${activeClass} snap-center">
                        <span class="text-[10px] font-medium opacity-80">${day.date}</span>
                        <span class="text-base font-bold">${day.dayOfWeek}</span>
                    </button>
                `;
            }).join('');
        }

        function renderBottomNav() {
            const nav = document.getElementById('bottom-nav');
            nav.innerHTML = NAV_TABS.map(tab => {
                const isActive = tab.id === state.activeTab;
                const colorClass = isActive ? (tab.color || 'text-indigo-900') : 'text-stone-400';
                const fontClass = isActive ? 'font-bold' : 'font-medium';
                const bgClass = isActive ? 'bg-stone-100/80' : 'hover:bg-stone-50/50';

                return `
                    <button onclick="switchTab('${tab.id}')" class="flex flex-col items-center justify-center py-1 px-3 rounded-2xl transition-all ${bgClass} ${colorClass}">
                        ${getIcon(tab.icon, `w-5 h-5 mb-0.5 ${isActive ? 'scale-110' : ''}`)}
                        <span class="text-[11px] ${fontClass}">${tab.label}</span>
                    </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderItineraryView() {
            const currentDay = TRIP_DATA.Itinerary.find(d => d.id === state.selectedDayId) || TRIP_DATA.Itinerary[0];
            renderHeaderStatus(currentDay);

            const deletedItems = getDeletedItems();

            const itemsHtml = currentDay.items.map((item, idx) => {
                const itemId = `${currentDay.id}_item_${idx}`;
                const isDeleted = deletedItems.includes(itemId);
                const style = ITEM_STYLES[item.type] || ITEM_STYLES.visit;
                
                const mapBtn = item.mapUrl || item.title 
                    ? `<a href="${item.mapUrl || getGoogleMapUrl(item.title)}" target="_blank" rel="noopener noreferrer" class="p-2 text-stone-400 hover:text-indigo-600 transition-colors shrink-0">
                        ${getIcon('map-pin', 'w-5 h-5')}
                       </a>` 
                    : '';

                const iconHtml = style.emoji 
                    ? `<span class="text-xl">⛩️</span>` 
                    : getIcon(style.icon, `w-5 h-5 ${style.color}`);

                return `
                    <div class="bg-white/95 rounded-2xl p-4 shadow-sm border-l-4 ${style.border} border-stone-100 flex items-start gap-3 relative transition-all duration-200 ${isDeleted ? 'opacity-40 grayscale bg-stone-100/70' : ''}">
                        <div class="p-2 bg-stone-50 rounded-xl shrink-0 mt-0.5">
                            ${iconHtml}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                ${item.time ? `<span class="text-xs font-bold text-stone-400 bg-stone-100 px-2 py-0.5 rounded-md shrink-0">${item.time}</span>` : ''}
                                <h3 class="font-bold text-stone-800 text-sm leading-snug break-words ${isDeleted ? 'line-through text-stone-500' : ''}">${item.title}</h3>
                            </div>
                            ${item.note ? `<p class="text-xs text-stone-500 leading-relaxed whitespace-pre-line ${isDeleted ? 'line-through' : ''}">${item.note}</p>` : ''}
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            ${mapBtn}
                            <button onclick="toggleDeleteItem('${itemId}')" class="p-2 text-stone-300 hover:text-stone-500 transition-colors" title="${isDeleted ? '復原' : '刪除'}">
                                ${getIcon(isDeleted ? 'rotate-ccw' : 'trash-2', 'w-4 h-4')}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-4 animate-fade-in">
                    <div class="bg-indigo-900/90 text-white rounded-2xl p-4 shadow-md backdrop-blur-md">
                        <div class="flex justify-between items-baseline mb-1">
                            <span class="text-xs font-semibold text-indigo-200">${currentDay.date} (${currentDay.dayOfWeek})</span>
                            <span class="text-xs text-indigo-200">${currentDay.items.length} 個景點/行程</span>
                        </div>
                        <h2 class="text-lg font-bold">${currentDay.location}</h2>
                    </div>
                    <div class="space-y-3">
                        ${itemsHtml}
                    </div>
                    ${FOOTER_HTML}
                </div>
            `;
        }

            renderHeaderStatus(null);

            const flightsHtml = TRIP_DATA.flights.map(f => `
                <div class="bg-white/95 rounded-2xl p-4 shadow-sm border border-stone-200/50 space-y-3">
                    <div class="flex justify-between items-center border-b border-stone-100 pb-2">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 bg-indigo-50 text-indigo-900 font-bold text-xs rounded-md">${f.type}</span>
                            <span class="text-xs text-stone-500 font-medium">${f.date}</span>
                        </div>
                        <a href="${f.flightUrl}" target="_blank" class="text-xs text-indigo-600 font-semibold hover:underline flex items-center gap-1">
                            ${f.code} ${getIcon('external-link', 'w-3 h-3')}
                        </a>
                    </div>
                    <div class="flex items-center justify-between text-center">
                        <div class="text-left">
                            <div class="text-xs text-stone-400 font-medium">${f.airline}</div>
                            <div class="text-sm font-bold text-stone-800">${f.route.split(' ➔ ')[0]}</div>
                        </div>
                        <div class="flex flex-col items-center px-2">
                            <span class="text-[10px] text-stone-400">${f.duration}</span>
                            <div class="w-16 h-[2px] bg-stone-200 relative my-1">
                                <div class="absolute -top-1 right-0 w-2 h-2 border-r-2 border-t-2 border-stone-400 rotate-45"></div>
                            </div>
                            <span class="text-[10px] text-stone-400">${f.class}</span>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-stone-400 font-medium">${f.aircraft}</div>
                            <div class="text-sm font-bold text-stone-800">${f.route.split(' ➔ ')[1]}</div>
                        </div>
                    </div>
                    <div class="bg-stone-50 rounded-xl p-2.5 text-xs text-stone-600 space-y-1">
                        <div>航廈：<span class="font-semibold text-stone-800">${f.terminal}</span></div>
                    </div>
                </div>
            `).join('');

            const hotelsHtml = TRIP_DATA.hotels.map(h => `
                <div class="bg-white/95 rounded-2xl p-4 shadow-sm border border-stone-200/50 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-1 text-amber-500 text-xs mb-1">
                                ${'★'.repeat(h.stars)}
                            </div>
                            <h3 class="font-bold text-stone-800 text-base leading-tight">${h.name}</h3>
                            <p class="text-xs text-stone-400 font-medium">${h.engName}</p>
                        </div>
                        <a href="${h.mapUrl}" target="_blank" class="p-2 text-stone-400 hover:text-indigo-600 transition-colors shrink-0">
                            ${getIcon('map-pin', 'w-5 h-5')}
                        </a>
                    </div>

                    ${h.image ? `<div class="rounded-xl overflow-hidden h-36 w-full bg-stone-100">
                        <img src="${h.image}" alt="${h.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/e2e8f0/475569?text=Hotel+Image';"/>
                    </div>` : ''}

                    <div class="space-y-1.5 text-xs text-stone-600">
                        <div class="flex items-center gap-2">
                            ${getIcon('calendar', 'w-4 h-4 text-stone-400')}
                            <span class="font-semibold text-indigo-900">${h.dates}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${getIcon('map-pin', 'w-4 h-4 text-stone-400')}
                            <span>${h.location}</span>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-1.5 pt-1">
                        ${h.features.map(feat => `<span class="px-2 py-0.5 bg-stone-100 text-stone-600 text-[10px] rounded-md font-medium">${feat}</span>`).join('')}
                    </div>

                    ${h.note ? `<p class="text-xs text-stone-500 bg-stone-50 p-2.5 rounded-xl border border-stone-100 leading-relaxed">${h.note}</p>` : ''}
                </div>
            `).join('');

            return `
                <div class="space-y-6 animate-fade-in">
                    <div>
                        <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider mb-3 px-1">航班資訊</h2>
                        <div class="space-y-3">${flightsHtml}</div>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider mb-3 px-1">住宿資訊</h2>
                        <div class="space-y-3">${hotelsHtml}</div>
                    </div>
                    ${FOOTER_HTML}
                </div>
            `;
        }

        function renderManholeView() {
            renderHeaderStatus(null);

            const noticesHtml = DRIVE_NOTICES.map(n => `
                <div class="bg-white/95 rounded-2xl p-4 shadow-sm border border-stone-200/50 space-y-1">
                    <h3 class="font-bold text-stone-800 text-sm flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                        ${n.title}
                    </h3>
                    <p class="text-xs text-stone-600 leading-relaxed pl-4">${n.text}</p>
                </div>
            `).join('');

            const signsHtml = TRAFFIC_SIGNS.map(s => `
                <div class="bg-white/95 rounded-2xl p-3 shadow-sm border border-stone-200/50 flex flex-col items-center text-center justify-between">
                    <div class="my-2">${s.svg}</div>
                    <div>
                        <h4 class="font-bold text-stone-800 text-xs">${s.title}</h4>
                        <p class="text-[10px] text-stone-400">${s.desc}</p>
                    </div>
                </div>
            `).join('');

            const markingsHtml = ROAD_MARKINGS.map(m => `
                <div class="bg-white/95 rounded-2xl p-3 shadow-sm border border-stone-200/50 space-y-2">
                    ${m.lineStyle}
                    <div>
                        <h4 class="font-bold text-stone-800 text-xs">${m.title}</h4>
                        <p class="text-[10px] text-stone-500">${m.desc}</p>
                    </div>
                </div>
            `).join('');

            return `
                <div class="space-y-6 animate-fade-in">
                    <div>
                        <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider mb-3 px-1">重點駕駛安全須知</h2>
                        <div class="space-y-2">${noticesHtml}</div>
                    </div>

                    <div>
                        <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider mb-3 px-1">常見標誌</h2>
                        <div class="grid grid-cols-2 gap-3">${signsHtml}</div>
                    </div>

                    <div>
                        <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider mb-3 px-1">車道線標線繪製規定</h2>
                        <div class="grid grid-cols-2 gap-3">${markingsHtml}</div>
                    </div>
                    ${FOOTER_HTML}
                </div>
            `;
        }

        function renderMapView() {
            renderHeaderStatus(null);

            const mapSectionsHtml = TRIP_DATA.mapLinks.map(sec => `
                <div class="bg-white/95 rounded-2xl p-4 shadow-sm border border-stone-200/50 space-y-3">
                    <h3 class="font-bold text-stone-800 text-sm flex items-center gap-2 border-b border-stone-100 pb-2">
                        ${getIcon(sec.icon, 'w-4 h-4 text-indigo-600')}
                        ${sec.category}
                    </h3>
                    <div class="space-y-2">
                        ${sec.links.map(link => `
                            <a href="${link.url}" target="_blank" class="flex items-center justify-between p-2.5 rounded-xl bg-stone-50 hover:bg-stone-100 transition-colors group">
                                <span class="text-xs font-semibold text-stone-700 group-hover:text-indigo-900">${link.title}</span>
                                ${getIcon('external-link', 'w-3.5 h-3.5 text-stone-400 group-hover:text-indigo-600')}
                            </a>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            return `
                <div class="space-y-4 animate-fade-in">
                    <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider mb-1 px-1">實用地圖與連結</h2>
                    ${mapSectionsHtml}
                    ${FOOTER_HTML}
                </div>
            `;
        }

        function renderNotesView() {
            renderHeaderStatus(null);

            const notesHtml = TRIP_DATA.notes.map(note => `
                <div class="bg-white/95 rounded-2xl p-4 shadow-sm border border-stone-200/50 space-y-3">
                    <h3 class="font-bold text-stone-800 text-sm border-b border-stone-100 pb-2">${note.title}</h3>
                    <div class="rounded-xl overflow-hidden bg-stone-100">
                        <img src="${note.image}" alt="${note.title}" class="w-full h-auto object-cover" onerror="this.src='https://placehold.co/800x600/e2e8f0/475569?text=Metro+Map';"/>
                    </div>
                </div>
            `).join('');

            return `
                <div class="space-y-4 animate-fade-in">
                    <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider mb-1 px-1">行程備註</h2>
                    ${notesHtml}
                    ${FOOTER_HTML}
                </div>
            `;
        }

        function updateView() {
            renderDateScroller();
            renderBottomNav();

            const contentEl = document.getElementById('main-content');
            let html = '';

            switch (state.activeTab) {
                case 'Itinerary':
                    html = renderItineraryView();
                    break;
                case 'flights':
                    html = renderFlightsView();
                    break;
                case 'manhole':
                    html = renderManholeView();
                    break;
                case 'map':
                    html = renderMapView();
                    break;
                case 'notes':
                    html = renderNotesView();
                    break;
                default:
                    html = renderItineraryView();
            }

            contentEl.innerHTML = html;
            lucide.createIcons();
            contentEl.scrollTop = 0;
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            updateView();
        }

        function selectDay(dayId) {
            state.selectedDayId = dayId;
            updateView();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initManifest();
            initTheme();
            checkPwaStatus();
            updateView();
        });
    </script>
</body>
</html>
